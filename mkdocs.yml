site_name: NervaPack
site_description: Privacy-first, offline knowledge graph for developers
site_author: Preetam Ramdhave
site_url: https://nervapack.readthedocs.io

repo_name: ramdhavepreetam/NervaPack
repo_url: https://github.com/ramdhavepreetam/NervaPack
edit_uri: edit/master/docs/

copyright: Copyright &copy; 2024-2026 Preetam Ramdhave

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.instant        # Fast page loads
    - navigation.tracking       # URL updates with scroll
    - navigation.tabs           # Top-level tabs
    - navigation.tabs.sticky    # Tabs stick on scroll
    - navigation.sections       # Sections in sidebar
    - navigation.expand         # Expand sections by default
    - navigation.indexes        # Index pages for sections
    - navigation.top            # Back to top button
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight search terms
    - search.share              # Share search results
    - content.code.copy         # Copy code button
    - content.code.annotate     # Code annotations
    - content.tabs.link         # Link content tabs

  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 2

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ramdhavepreetam/NervaPack
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nervapack/

  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - LLM Providers: getting-started/llm-providers.md

  - Performance:
    - Verified Benchmarks: BENCHMARKS.md
    - Methodology: METHODOLOGY.md
    - Messy Code Performance: MESSY_CODE_PERFORMANCE.md

  - User Guide:
    - Core Concepts:
      - Knowledge Graphs: user-guide/concepts/knowledge-graphs.md
      - Architecture: user-guide/concepts/architecture.md
      - Token Efficiency: user-guide/concepts/token-efficiency.md
    - Commands:
      - ingest: user-guide/commands/ingest.md
      - query: user-guide/commands/query.md
      - enrich: user-guide/commands/enrich.md
      - doctor: user-guide/commands/doctor.md
      - clean: user-guide/commands/clean.md
      - visualize: user-guide/commands/visualize.md
      - sync: user-guide/commands/sync.md
      - status: user-guide/commands/status.md
      - explore: user-guide/commands/explore.md
      - dependencies: user-guide/commands/dependencies.md
      - serve: user-guide/commands/serve.md
      - history: user-guide/commands/history.md
      - hotspots: user-guide/commands/hotspots.md

  - Memory:
    - Overview: memory/index.md
    - Concepts & Data Model: memory/concepts.md
    - Use Cases:
      - Chatbot Memory: memory/use-cases/chatbot.md
      - AI Coding Agent: memory/use-cases/coding-agent.md
      - Multi-Agent Systems: memory/use-cases/multi-agent.md
      - Decision Log & ADRs: memory/use-cases/adr-store.md
    - MCP Tools (17): memory/mcp-tools.md
    - Python API: memory/python-api.md
    - CLI Reference: memory/cli.md
    - Roadmap: memory/roadmap.md

  - Integrations:
    - MCP Server (Code Graph): integrations/mcp-server.md
    - Python SDK: integrations/python-sdk.md

  - API Reference:
    - Parser: api/parser.md
    - Graph Builder: api/graph.md
    - LLM Providers: api/llm.md

  - Contributing: contributing.md
  - Changelog: changelog.md
