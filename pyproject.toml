[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nervapack"
version = "0.3.1"
description = "Privacy-first, offline knowledge graph for developers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Preetam Ramdhave", email = "ramdhavepreetam@gmail.com"}
]
keywords = ["knowledge-graph", "rag", "ast", "code-search", "offline", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tree-sitter>=0.22.3",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.2",
    "tree-sitter-typescript>=0.21.2",
    "networkx>=3.1",
    "ollama>=0.2.0",
    "gitpython>=3.1.30",
    "chromadb>=0.4.24",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
mcp     = ["mcp[cli]>=1.0.0"]
metrics = ["tiktoken>=0.5.0"]
dashboard = ["streamlit>=1.29.0", "plotly>=5.18.0"]
go     = ["tree-sitter-go>=0.21.0"]
rust   = ["tree-sitter-rust>=0.21.0"]
java   = ["tree-sitter-java>=0.21.0"]
c      = ["tree-sitter-c>=0.21.0"]
cpp    = ["tree-sitter-cpp>=0.21.0"]
ruby   = ["tree-sitter-ruby>=0.21.0"]
csharp = ["tree-sitter-c-sharp>=0.21.0"]
all-languages = [
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/ramdhavepreetam/NervaPack"
Repository = "https://github.com/ramdhavepreetam/NervaPack"
"Bug Tracker" = "https://github.com/ramdhavepreetam/NervaPack/issues"
Documentation = "https://github.com/ramdhavepreetam/NervaPack#readme"

[project.scripts]
nervapack     = "nervapack.cli:app"
nervapack-mcp = "nervapack.mcp_server:main"
